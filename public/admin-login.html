<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Loans Admin Login</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <div class="welcome-card">

        <h1>🔒 Smart Loans</h1>

        <h2>Administrator Login</h2>

        <br>

        <label>Username</label>

        <input
            type="text"
            id="username"
            placeholder="Enter username">

        <br><br>

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter password">

        <br><br>

        <label>

            <input
                type="checkbox"
                id="showPassword">

            Show Password

        </label>

        <br><br>

        <button id="loginBtn">

            Login

        </button>

        <br><br>

        <p id="loginMessage"></p>

    </div>

</div>

<script src="js/admin-login.js"></script>

</body>

</html>
