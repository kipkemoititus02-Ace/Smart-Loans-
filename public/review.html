<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Review Application | Smart Loans</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

<div class="welcome-card">

<div class="progress">
Step 3 of 5
</div>

<h2>Review Your Application</h2>

<p class="intro">
Please review your information before continuing.
</p>

<h3>Loan Details</h3>

<div class="feature">
<strong>Loan Amount:</strong>
<p id="loanAmount"></p>
</div>

<div class="feature">
<strong>Repayment Period:</strong>
<p id="loanPeriod"></p>
</div>

<div class="feature">
<strong>Monthly Repayment:</strong>
<p id="monthlyRepayment"></p>
</div>

<div class="feature">
<strong>Total Repayment:</strong>
<p id="totalRepayment"></p>
</div>

<br>

<h3>Personal Information</h3>

<div class="feature">
<strong>Full Names:</strong>
<p id="fullNames"></p>
</div>

<div class="feature">
<strong>Date of Birth:</strong>
<p id="dob"></p>
</div>

<div class="feature">
<strong>National ID Number:</strong>
<p id="nationalId"></p>
</div>

<div class="feature">
<strong>Mobile Phone Number:</strong>
<p id="phoneNumber"></p>
</div>

<div class="feature">
<strong>Occupation:</strong>
<p id="occupation"></p>
</div>

<div class="feature">
<strong>Purpose of Loan:</strong>
<p id="loanPurpose"></p>
</div>

<br>

<button onclick="history.back()">
⬅ Back
</button>

<br><br>

<button id="continueReview">
Continue ➜
</button>

</div>

</div>

<script src="js/review.js"></script>

</body>

</html>
