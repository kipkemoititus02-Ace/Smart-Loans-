<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loan Calculator | Smart Loans</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

<div class="welcome-card">

<h2>Loan Calculator</h2>

<p class="intro">
Enter your desired loan amount and repayment period.
The calculator will automatically estimate your repayments.
</p>

<div class="progress">
Step 1 of 5
</div>

<label>Loan Amount ($)</label>

<input
type="number"
id="loanAmount"
placeholder="Enter amount">

<br><br>

<label>Repayment Period</label>

<select id="loanPeriod">

<option value="">Select Period</option>

<option value="1">1 Month</option>

<option value="3">3 Months</option>

<option value="6">6 Months</option>

<option value="12">12 Months</option>

<option value="18">18 Months</option>

<option value="24">24 Months</option>

</select>

<br><br>

<div class="feature">

<strong>Monthly Repayment</strong>

<p id="monthlyRepayment">
$0.00
</p>

</div>

<br>

<div class="feature">

<strong>Total Repayment</strong>

<p id="totalRepayment">
$0.00
</p>

</div>

<br>

<button id="continueBtn" disabled>

Continue

</button>

</div>

</div>

<script src="js/calculator.js"></script>

</body>

</html>
